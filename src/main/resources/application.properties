
# 비관적 락 대기 한도(초). 그룹 참가 경합에서 3초 안에 락을 못 잡으면 포기하고 409 로 내려간다.
#
# GroupRepository 의 @QueryHint(jakarta.persistence.lock.timeout) 로는 지정되지 않는다.
# Hibernate 의 MySQL 다이얼렉트는 그 힌트에서 0(NOWAIT)과 -2(SKIP LOCKED)만 SQL 로 옮기고
# 3000 같은 값은 대응하는 MySQL 문법이 없어 조용히 버린다(= 'for update' 평문이 나간다).
# 그대로 두면 서버 기본값 innodb_lock_wait_timeout=50 이 걸려 요청 하나가 최대 50초간 스레드를 점유한다.
#
# 세션 변수는 JDBC URL 에 싣는다. Hikari 의 connection-init-sql 로 주면 이 파일이 모든 프로파일의
# base 로 로드되는 탓에 H2 를 쓰는 test 프로파일까지 따라가 커넥션 생성이 깨진다.
spring.datasource.url=jdbc:mysql://localhost:3306/gachi_gaja?sessionVariables=innodb_lock_wait_timeout=3
spring.datasource.username=root
spring.datasource.password=GgTest!2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#######
spring.application.name=server

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini
gemini.model.name=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.api.key=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.override-with-generic-response=false

logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security=DEBUG