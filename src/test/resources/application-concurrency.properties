# ===== 동시성 재현 테스트 전용 프로파일 (MySQL/InnoDB) =====
# ConcurrencyTestSupport 가 @ActiveProfiles("concurrency") 로 이 파일을 쓴다.
# 개발 DB(gachi_gaja)를 건드리지 않도록 별도 스키마를 사용한다.
# 비관적 락 대기와 REPEATABLE READ 스냅샷 시점은 InnoDB 고유 동작이라 H2로는 재현되지 않는다.
#
# 접속 정보는 환경변수로 주입한다(비밀번호를 커밋하지 않기 위함):
#   TEST_DB_URL / TEST_DB_USER / TEST_DB_PASSWORD
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/gachi_gaja_test?createDatabaseIfNotExist=true}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스레드가 커넥션을 못 받아 대기하면 락이 아니라 풀 고갈을 측정하게 된다.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=5000

# 프로덕션과 같은 락 대기 한도를 쓴다(@QueryHint 로는 지정되지 않는다 — application.properties 주석 참고).
# TEST_DB_URL 이 통째로 대체될 수 있어 URL 대신 커넥션 초기화 SQL 로 건다.
# 이 파일은 concurrency 프로파일에서만 로드되므로 H2 를 쓰는 test 프로파일에는 영향이 없다.
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout = 3

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 테스트에 불필요한 외부 연동/문서화 비활성화
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
gemini.model.name=test-model
gemini.api.url=http://localhost:0/
gemini.api.key=test-key

logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=WARN
