# ===== 기본 테스트 프로파일 (H2 인메모리) =====
# 단위/슬라이스 테스트용. 개발 DB(gachi_gaja)에 붙지 않도록 분리한다.
#
# InnoDB 고유 동작(FOR UPDATE 대기, REPEATABLE READ 스냅샷 시점)에 의존하는
# 동시성 재현 테스트는 H2로 재현되지 않으므로 concurrency 프로파일을 쓴다.
# → src/test/resources/application-concurrency.properties
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=GROUPS,GROUP
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# 테스트에 불필요한 외부 연동/문서화 비활성화
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Gemini dummy key (test only)
gemini.model.name=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.api.key=test-key
